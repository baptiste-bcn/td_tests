[tool.ruff]
# Version de Python cible
target-version = "py310"
# Longueur de ligne max (standard 88 ou 100)
line-length = 100

[tool.ruff.lint]
# "E" (errors), "F" (Pyflakes), "I" (isort - tri des imports)
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true