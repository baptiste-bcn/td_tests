- name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov ruff mypy

    - name: Lint with Ruff
      run: |
        # 'check' vérifie les erreurs, 'format --check' vérifie que le code est bien formaté
        ruff check .
        ruff format --check .

    - name: Static type check with mypy
      run: |
        # On ignore les imports manquants pour les bibliothèques tierces non typées
        mypy . --ignore-missing-imports --check-untyped-defs

    - name: Test with coverage
      run: |
        pytest --cov=. --cov-fail-under=80